<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>chat</title>
  </head>
  <body class="container">
    <div class="row mt-5">
      <div class="col-sm-6">
        <h3>Send Message</h3>
        <hr />
        <input
          type="text"
          id="textUid"
          class="form-control mb-2"
          placeholder="uid"
          autocomplete="off"
        />
        <input
          type="text"
          id="textMessage"
          class="form-control mb-2"
          placeholder="message"
          autocomplete="off"
        />

        <h5>Online Users</h5>
        <hr />
        <ul id="ulUsers"></ul>
      </div>

      <div class="col-sm-6">
        <h5>Whole Chat</h5>
        <hr />
        <ul id="ulMessage"></ul>
      </div>
    </div>


    <button id="btnExit" class="btn btn-outline-danger">
        Logout
    </button>

    <script src="./socket.io/socket.io.js"></script>
    <script src="./js/chat.js"></script>
  </body>
</html>
